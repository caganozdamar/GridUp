services:
  postgres:
    image: postgres:16-alpine
    container_name: grid-up-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grid_up}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grid_up}
      POSTGRES_DB: ${POSTGRES_DB:-grid_up}
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-grid_up}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
